name: Compilar APK Billetera V2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BilleteraAndroid
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generar APK Debug
        run: gradle assembleDebug

      - name: Subir APK Nueva Diseno Negro
        uses: actions/upload-artifact@v4
        with:
          name: Billetera-Negra-V2-APK
          path: BilleteraAndroid/app/build/outputs/apk/debug/app-debug.apk
